<!doctype html><meta charset="utf-8"><body><script type="module">
import { SONGS } from '../../js/songs.js';
import { renderSong, validateSpec, chartSource, compile } from '../../js/synth.js';
const out = [];
for (const s of SONGS) {
  const errs = validateSpec(s); const c = compile(s);
  const t = performance.now(); const buf = await renderSong(s);
  const ms = performance.now() - t;
  const d = buf.getChannelData(0); let rms = 0, peak = 0, nan = 0;
  for (let i = 0; i < d.length; i++) { const v = d[i]; if (v !== v) nan++; rms += v * v; if (Math.abs(v) > peak) peak = Math.abs(v); }
  // rms per section
  const secs = c.sections.map(sec => { const a = Math.floor((c.t0 + sec.s0 * c.stepDur) * 44100), b = Math.floor((c.t0 + sec.s1 * c.stepDur) * 44100); let r = 0; for (let i = a; i < b; i++) r += d[i] * d[i]; return sec.name + ':' + Math.sqrt(r / (b - a)).toFixed(3); });
  out.push({ id: s.id, errs, dur: buf.duration.toFixed(1), renderMs: Math.round(ms), rms: Math.sqrt(rms / d.length).toFixed(3), peak: peak.toFixed(3), nan, cands: chartSource(s).cands.length, secs: secs.join(' ') });
}
window.RESULT = out;
</script>
